<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팀 카드뉴스</title>
<meta name="description" content="매일 아침 올라오는 우리 팀 카드뉴스 모음">
<meta property="og:type" content="website">
<meta property="og:title" content="팀 카드뉴스">
<meta property="og:description" content="매일 아침 올라오는 우리 팀 카드뉴스 모음">
<!-- 대표 썸네일: assets/og.png 를 올린 뒤 아래 줄의 주석을 풀고 주소를 실제 사이트 주소로 바꾸세요 -->
<!-- <meta property="og:image" content="https://조직이름.github.io/cardnews/assets/og.png"> -->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f4f2ee;
    --surface: #ffffff;
    --ink: #17181c;
    --ink-2: #5b5d66;
    --line: #e3e0d9;
    --accent: #1f4fd8;
    --accent-ink: #ffffff;
    --hero-bg: #17181c;
    --hero-ink: #ffffff;
    --hero-sub: rgba(255,255,255,.68);
    --chip-bg: rgba(255,255,255,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214;
      --surface: #1a1b1f;
      --ink: #eceae6;
      --ink-2: #9a9ca5;
      --line: #2a2b31;
      --accent: #7b9bff;
      --accent-ink: #0d1020;
      --hero-bg: #f1efe9;
      --hero-ink: #15161a;
      --hero-sub: rgba(21,22,26,.62);
      --chip-bg: rgba(21,22,26,.08);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
    word-break: keep-all;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }
  header { margin-bottom: 20px; }
  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--accent);
    margin: 0 0 6px;
  }
  h1 {
    font-size: 26px;
    line-height: 1.25;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .hero {
    display: block;
    text-decoration: none;
    background: var(--hero-bg);
    color: var(--hero-ink);
    border-radius: 22px;
    padding: 22px 22px 20px;
    transition: transform .15s ease;
  }
  .hero:active { transform: scale(.985); }
  .chip {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--chip-bg);
  }
  .hero-title {
    font-size: 23px;
    line-height: 1.35;
    letter-spacing: -0.02em;
    margin: 14px 0 6px;
  }
  .hero-desc {
    margin: 0 0 4px;
    font-size: 15px;
    color: var(--hero-sub);
  }
  .hero-cta {
    display: inline-flex;
    gap: 6px;
    margin-top: 18px;
    font-size: 15px;
    font-weight: 700;
    padding: 11px 18px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
  }

  .empty {
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 22px;
    padding: 28px 22px;
    text-align: center;
    font-weight: 600;
  }
  .empty span { font-weight: 400; font-size: 14px; color: var(--ink-2); }

  .archive { margin-top: 34px; }
  .archive > h2 {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-2);
    margin: 0 0 10px;
  }
  .month { margin-bottom: 18px; }
  .month h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
    margin: 0 0 6px 4px;
  }
  .month ul {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  .month li + li { border-top: 1px solid var(--line); }
  .month a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    color: inherit;
    text-decoration: none;
    min-height: 52px;
  }
  .month a:active { background: var(--bg); }
  .d {
    flex: 0 0 46px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
  }
  .d small {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
  }
  .t {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .arrow { color: var(--ink-2); font-size: 20px; }
  .muted { color: var(--ink-2); font-size: 14px; margin: 0 4px; }

  footer {
    margin-top: 30px;
    font-size: 12px;
    color: var(--ink-2);
    text-align: center;
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">TEAM DAILY</p>
    <h1>오늘의 카드뉴스</h1>
  </header>

  {{LATEST}}

  <section class="archive">
    <h2>지난 카드뉴스</h2>
    {{ARCHIVE}}
  </section>

  <footer>총 {{COUNT}}건 · 마지막 업데이트 {{UPDATED}}</footer>
</main>
</body>
</html>
