<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta name="robots" content="noindex, nofollow">
<!--
  홈 화면 = 오늘의 카드뉴스.
  가장 최근 카드뉴스가 맨 위에 그대로 보이고, 맨 아래에 지난 카드뉴스 목록(링크)이 한 줄씩 나옵니다.
  아래 FEED 자리는 배포할 때 자동으로 채워집니다.
-->
<style>
  :root { --bg: #e6ebee; --ink: #5b6169; --text: #1e2329; --line: rgba(0,0,0,.1); --hover: rgba(0,0,0,.04); }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171a; --ink: #9aa0a8; --text: #e8eaed; --line: rgba(255,255,255,.1); --hover: rgba(255,255,255,.05); } }
  html, body { margin: 0; background: var(--bg); }
  .card-frame { display: block; width: 100%; height: 100vh; height: 100svh; border: 0; }
  .archive {
    max-width: 640px; margin: 0 auto; padding: 28px 16px calc(96px + env(safe-area-inset-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .archive h2 { margin: 0 0 8px; font-size: 15px; font-weight: 700; color: var(--ink); }
  .archive ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .archive li { border-bottom: 1px solid var(--line); }
  .archive a {
    display: flex; gap: 12px; align-items: baseline; padding: 14px 2px;
    color: var(--text); text-decoration: none; font-size: 15px; line-height: 1.4;
  }
  .archive a:active, .archive a:hover { background: var(--hover); }
  .archive .d { flex: none; color: var(--ink); font-size: 13px; font-weight: 600; min-width: 92px; }
  .archive .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { padding: 40vh 16px; text-align: center; color: var(--ink); font: 15px/1.5 sans-serif; }
  .fab {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 10;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 11px 16px; border: 0; border-radius: 999px; cursor: pointer;
    background: #FEE500; color: #191919;
    font: 700 14px/1 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    box-shadow: 0 6px 18px rgba(0,0,0,.22);
  }
</style>
</head>
<body>
{{FEED}}
<script>
  // 카드뉴스 높이에 맞춰 칸 크기를 자동으로 맞춤
  (function () {
    var frames = Array.prototype.slice.call(document.querySelectorAll(".card-frame"));

    function fit(f) {
      try {
        var d = f.contentDocument;
        if (!d || !d.documentElement) return;
        var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0);
        var min = window.innerHeight;
        f.style.height = Math.max(h, min) + "px";
      } catch (e) {}
    }
    frames.forEach(function (f) {
      f.addEventListener("load", function () {
        fit(f);
        try {
          if (window.ResizeObserver) new ResizeObserver(function () { fit(f); }).observe(f.contentDocument.body);
        } catch (e) {}
      });
    });
    window.addEventListener("resize", function () { frames.forEach(fit); });

  })();
</script>
<script src="assets/config.js"></script>
<script src="assets/share.js"></script>
</body>
</html>
