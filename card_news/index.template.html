<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta name="robots" content="noindex, nofollow">
<!--
  홈 화면 = 오늘의 카드뉴스.
  가장 최근 카드뉴스가 맨 위에 그대로 보이고, 스크롤을 내리면 지난 카드뉴스가 날짜순으로 이어집니다.
  아래 FEED 자리는 배포할 때 자동으로 채워집니다.
-->
<style>
  :root { --bg: #e6ebee; --ink: #5b6169; --line: rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171a; --ink: #9aa0a8; --line: rgba(255,255,255,.08); } }
  html, body { margin: 0; background: var(--bg); }
  .card-frame { display: block; width: 100%; height: 100vh; height: 100svh; border: 0; }
  .divider {
    display: flex; align-items: center; gap: 12px;
    padding: 22px 16px;
    color: var(--ink);
    font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .empty { padding: 40vh 16px; text-align: center; color: var(--ink); font: 15px/1.5 sans-serif; }
  .fab {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 10;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 11px 16px; border: 0; border-radius: 999px; cursor: pointer;
    background: #FEE500; color: #191919;
    font: 700 14px/1 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    box-shadow: 0 6px 18px rgba(0,0,0,.22);
  }
</style>
</head>
<body>
{{FEED}}
<script>
  // 카드뉴스 높이에 맞춰 칸 크기를 자동으로 맞추고,
  // 지금 화면에 보이는 카드뉴스를 공유 버튼이 보내도록 연결
  (function () {
    var frames = Array.prototype.slice.call(document.querySelectorAll(".card-frame"));
    var fab = document.querySelector(".fab");

    function fit(f) {
      try {
        var d = f.contentDocument;
        if (!d || !d.documentElement) return;
        var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0);
        var min = window.innerHeight;
        f.style.height = Math.max(h, min) + "px";
      } catch (e) {}
    }
    frames.forEach(function (f) {
      f.addEventListener("load", function () {
        fit(f);
        try {
          if (window.ResizeObserver) new ResizeObserver(function () { fit(f); }).observe(f.contentDocument.body);
        } catch (e) {}
      });
    });
    window.addEventListener("resize", function () { frames.forEach(fit); });

    if (fab && "IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) {
            fab.setAttribute("data-share", en.target.getAttribute("data-url"));
            fab.setAttribute("data-title", en.target.getAttribute("title"));
          }
        });
      }, { rootMargin: "-45% 0px -45% 0px" });
      frames.forEach(function (f) { io.observe(f); });
    }
  })();
</script>
<script src="assets/config.js"></script>
<script src="assets/share.js"></script>
</body>
</html>
