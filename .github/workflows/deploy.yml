# card_news/ 에 파일이 올라오면(= main 브랜치에 커밋되면) 자동으로 사이트를 다시 만들어 배포합니다.
name: 카드뉴스 배포

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동으로 다시 배포할 때

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 파일 이름 정리 (윈도우에서 생기는 .html.html → .html)
        run: |
          shopt -s nullglob
          for f in card_news/cards/*.html.html; do mv "$f" "${f%.html}"; done
      - name: 사이트 만들기
        run: python3 card_news/scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: card_news/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
